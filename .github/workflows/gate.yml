name: gate

# Two harnesses decide whether a change is acceptable:
#
#   tools/difftest.ps1   compiles every case in tests/diff/ with all three engines
#                        (C++ interpreter, C++ LLVM backend, self-hosted backend)
#                        and requires identical output; every
#                        examples/*_error.miko must be rejected. One engine
#                        disagreeing fails the build.
#   tools/bootstrap.ps1  compiles the self-hosted compiler with itself twice and
#                        requires both generations to emit identical IR and to
#                        compile every case correctly.
#
# Together they catch the failure mode this project keeps producing: a backend
# that compiles a program happily and gives the wrong answer.
#
# The build directory is build-vs-llvm on purpose: tools/difftest.ps1 looks for
# build-vs-llvm\Release\miko.exe by default, so no path has to be threaded
# through the command line.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Windows needs the LLVM release archive, not the LLVM installer. Neither
      # `choco install llvm` nor the official LLVM-*-win64.exe publishes
      # LLVMConfig.cmake - both install a clang-only tree whose lib/cmake/llvm holds
      # LLVMConfigExtensions.cmake and nothing else - so find_package(LLVM) fails
      # whichever directory is pointed at it. Checked on a machine with both
      # installed. The release archive carries the whole development tree.
      #
      # 22.1.8 specifically: 23.x is configured with zlib and zstd, so its exported
      # targets reference ZLIB::ZLIB and zstd::libzstd_static and the link needs both
      # libraries present; it also removes IRBuilder::CreateGlobalStringPtr and
      # rejects miko's generated IR. The 22.1.8 archive needs neither dependency and
      # is a version this compiler is verified against.
      - name: Cache LLVM (Windows)
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: C:\llvm
          key: llvm-22.1.8-windows-x86_64

      - name: Install LLVM 22.1.8 from the release archive (Windows)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/clang+llvm-22.1.8-x86_64-pc-windows-msvc.tar.xz"
          $archive = Join-Path $env:RUNNER_TEMP "llvm.tar.xz"
          Write-Host "downloading $url"
          curl.exe -L --fail --retry 3 --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw "LLVM download failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path C:\llvm | Out-Null
          # .tar.xz, not .tar.zst: the zstd archives are compressed with a window
          # size bsdtar refuses by default ("Frame requires too much memory for
          # decoding"), which was verified here rather than in CI.
          tar -xf $archive -C C:\llvm --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw "LLVM extraction failed: $LASTEXITCODE" }
          Remove-Item $archive -Force

      - name: Locate LLVM and MinGW (Windows)
        shell: pwsh
        run: |
          $found = "C:\llvm\lib\cmake\llvm"
          if (-not (Test-Path (Join-Path $found "LLVMConfig.cmake"))) { throw "LLVMConfig.cmake missing from the archive layout" }
          Write-Host "LLVM_DIR=$found"
          "LLVM_DIR=$found" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "C:\llvm\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

          # difftest links the emitted IR with gcc, which LLVM does not provide.
          choco install mingw --yes --no-progress
          "C:\ProgramData\chocolatey\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Report toolchain
        run: |
          clang --version
          gcc --version
          cmake --version

      # Which Visual Studio the runner image ships is not something this workflow
      # should know. It used to say "Visual Studio 17 2022" and that is exactly how
      # the first real run failed: windows-latest had already moved to Visual
      # Studio 18 2026, so configure died before compiling a line. vswhere ships
      # with every VS 2017+ install, so the generator is detected.
      #
      # CMake's default is not usable: it picks Ninja when ninja is on PATH, and
      # Ninja has no -A platform and would build with MinGW, which cannot link
      # against the MSVC-built LLVM package.
      - name: Configure
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { $vswhere = "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe" }
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found - no Visual Studio on this runner" }
          $generator = $null
          foreach ($candidate in @(
            @{ Major = 18; Name = "Visual Studio 18 2026" },
            @{ Major = 17; Name = "Visual Studio 17 2022" }
          )) {
            $range = "[$($candidate.Major).0,$($candidate.Major + 1).0)"
            $found = & $vswhere -latest -products * -version $range -property installationPath 2>$null
            if ($found -and -not $generator) { $generator = $candidate.Name }
          }
          if (-not $generator) { throw "no Visual Studio with a C++ toolset found" }
          Write-Host "using generator: $generator"
          cmake -S . -B build-vs-llvm -G $generator -A x64 -DMIKO_ENABLE_LLVM=ON
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

      - name: Build the C++ compiler
        run: cmake --build build-vs-llvm --config Release --target miko

      # difftest exercises a third engine, the self-hosted compiler, so it has to
      # exist first. Building it from source rather than trusting dist/miko.exe
      # keeps the check honest: a stale committed binary would let a regression
      # in the self-hosted backend pass unnoticed.
      - name: Build the self-hosted compiler
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -match 'miko' } | ForEach-Object { try { $_.Kill() } catch {} }
          # out/ is not in the repository, so on a fresh clone it does not exist and
          # the IR writer reports "no such file or directory" for a path it was never
          # able to create.
          New-Item -ItemType Directory -Force -Path out | Out-Null
          & build-vs-llvm\Release\miko.exe compiler\main_ll.miko --compile --emit-ir -o out\self.ll
          if ($LASTEXITCODE -ne 0) { throw "self-hosted IR emission failed" }
          cmd /c "dist\miko-link.bat out\self.ll out\miko_self.exe"
          if (-not (Test-Path out\miko_self.exe)) { throw "self-hosted link failed" }
          Copy-Item out\miko_self.exe dist\miko.exe -Force

      - name: Differential test across all three engines
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools\difftest.ps1 -RepoRoot .
          if ($LASTEXITCODE -ne 0) { throw "difftest failed: $LASTEXITCODE case(s) disagreed" }

      - name: Bootstrap the self-hosted compiler twice
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools\bootstrap.ps1 -RepoRoot . -Generations 2
          if ($LASTEXITCODE -ne 0) { throw "bootstrap failed: generations diverged" }

      - name: Keep the artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-artefacts
          path: |
            out/*.ast
            out/*.sema
            out/*.ll
          retention-days: 7
