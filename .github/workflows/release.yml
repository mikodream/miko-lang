name: release

# Every push to main produces a tag and a release.
#
# Two ways to build, chosen per platform for a reason rather than for symmetry:
#
#   Linux and macOS are built on the machine the binary is for. Stage 0 is a C++
#   program linked against LLVM, so it needs a compiler and an LLVM that agree with
#   each other, and the cheapest way to get that is to use the platform's own.
#
#   Windows is cross-compiled on Linux with llvm-mingw. This is deliberate: the only
#   LLVM builds for Windows are MSVC ABI, and using them forces MSVC into the build,
#   which then cannot be reproduced anywhere else. llvm-mingw is a clang that targets
#   x86_64-w64-mingw32 and aarch64-w64-mingw32 from a Linux host with its own C
#   runtime and headers, so no Visual Studio, no Windows SDK and no Windows runner is
#   needed to produce the binaries - which is also what makes windows-arm64 possible,
#   since the arm64 Windows image has no Visual Studio at all.
#
# The thing that makes cross-compiling work at all: the self-hosted compiler emits
# LLVM IR text with no target triple and no data layout. The target enters only when
# something links that IR. So the same `miko.ll` becomes a Linux binary, a Windows
# x64 binary or a Windows arm64 binary depending on which clang links it, and there
# is no per-platform code generation to keep in sync.
#
# Cross-compiling does not get to skip verification. The Windows jobs build the
# package on Linux and then a separate job on a real Windows runner unpacks it, runs
# the compiler, and runs programs that were cross-linked from IR produced by the
# Linux gate - so a Windows binary that cannot execute fails in CI, not on a user's
# machine.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. A second push while a release is building waits rather
# than racing for the same tag number.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # The version of this backend, not of LLVM: 23 removed IRBuilder::CreateGlobalStringPtr
  # and rejects the IR this backend emits, so everything that links LLVM is pinned.
  LLVM_MINGW_TAG: "20261117"

jobs:
  version:
    name: decide the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from CMakeLists.txt
        id: read
        run: |
          set -euo pipefail
          version=$(grep -oP 'MIKO_VERSION="\K[^"]+' CMakeLists.txt | head -n1)
          if [ -z "$version" ]; then
            echo "could not read MIKO_VERSION from CMakeLists.txt" >&2
            exit 1
          fi
          tag="v${version}-${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $version as $tag"

  # ---------------------------------------------------------------------------
  # Linux and macOS, built natively.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: a release missing only one
      # archive is still worth shipping, and the gap is visible in the run summary.
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: linux-x64
            archive: miko-${{ needs.version.outputs.version }}-linux-x64.tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: linux-arm64
            archive: miko-${{ needs.version.outputs.version }}-linux-arm64.tar.gz
          - name: macos-x64
            os: macos-15-intel
            target: macos-x64
            archive: miko-${{ needs.version.outputs.version }}-macos-x64.tar.gz
          - name: macos-arm64
            os: macos-15
            target: macos-arm64
            archive: miko-${{ needs.version.outputs.version }}-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Pinned to 18 rather than whatever `llvm-dev` points at: 23.x removed
          # IRBuilder::CreateGlobalStringPtr and rejects this backend's IR, so an
          # unpinned install breaks the build the day the runner updates.
          #
          # libtinfo-dev, zlib1g-dev and libzstd-dev are not optional extras: LLVM's
          # archives call into terminfo and zstd, and without the -dev packages the
          # linker has no libtinfo.so to resolve set_curterm against.
          sudo apt-get install -y llvm-18 llvm-18-dev clang-18 libclang-18-dev gcc \
            libtinfo-dev zlib1g-dev libzstd-dev
          echo "LLVM_DIR=$(llvm-config-18 --cmakedir)" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      # macOS needs LLVM 22 and gets it two different ways, because only one of them
      # exists for each architecture.
      #
      # On macos-15-intel Homebrew's llvm resolved to 22.1.8_2, which builds and links
      # this backend. On macos-15 (arm64) the same formula is 23.1.5, which rejects its
      # IR, and the official 22.1.8 release has no x64 macOS asset - only
      # LLVM-22.1.8-macOS-ARM64.tar.xz - so the two architectures cannot share a path.
      #
      # The archive brings two problems that are really one. Its static libraries are
      # LLVM bitcode, which Xcode's linker (LLVM 17) refuses with "Unknown attribute
      # kind (102)"; building with the archive's own clang fixes that. Then that clang
      # uses the archive's libc++ headers, which declare __hash_memory as
      # _LIBCPP_EXPORTED_FROM_ABI at version 220108, while Apple's libc++.1.dylib does
      # not export it. Headers and library have to come from the same build, so the
      # archive's libc++, libc++abi and libunwind are linked statically: the binary
      # then carries its own C++ runtime instead of depending on Apple's vintage.
      - name: Install LLVM (macOS arm64)
        if: runner.os == 'macOS' && matrix.target == 'macos-arm64'
        run: |
          set -euo pipefail
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-macOS-ARM64.tar.xz"
          curl -fsSL "$url" -o llvm.tar.xz
          mkdir -p llvm-dist
          tar -xf llvm.tar.xz --strip-components=1 -C llvm-dist
          rm -f llvm.tar.xz
          # The archive does not carry libzstd but its LLVMSupport is built against
          # it, so without this the link stops at "ld: library 'zstd' not found".
          brew install zstd
          echo "LIBRARY_PATH=$(brew --prefix zstd)/lib" >> "$GITHUB_ENV"
          echo "LLVM_DIR=$PWD/llvm-dist/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "$PWD/llvm-dist/bin" >> "$GITHUB_PATH"
          # Producer and reader of the bitcode have to be the same LLVM, and only the
          # archive's clang is 22.
          echo "CC=$PWD/llvm-dist/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$PWD/llvm-dist/bin/clang++" >> "$GITHUB_ENV"
          # -nostdlib++ stops the driver adding -lc++, then the archive's static
          # libraries are named directly so the linker takes those and not Apple's.
          libs="$PWD/llvm-dist/lib"
          echo "CMAKE_EXE_LINKER_FLAGS=-nostdlib++ $libs/libc++.a $libs/libc++abi.a $libs/libunwind.a" >> "$GITHUB_ENV"
          ./llvm-dist/bin/llvm-config --version

      - name: Install LLVM (macOS x64)
        if: runner.os == 'macOS' && matrix.target == 'macos-x64'
        run: |
          set -euo pipefail
          brew install llvm zstd zlib
          prefix="$(brew --prefix llvm)"
          echo "LLVM_DIR=$prefix/lib/cmake/llvm" >> "$GITHUB_ENV"
          # keg-only: clang and llvm-config are not on PATH, and the link script calls
          # bare `clang`.
          echo "$prefix/bin" >> "$GITHUB_PATH"
          # find_library consults these through the hints CMakeLists passes it.
          echo "LIBRARY_PATH=$(brew --prefix zstd)/lib:$(brew --prefix zlib)/lib" >> "$GITHUB_ENV"
          "$prefix/bin/llvm-config" --version

      - name: Report the toolchain
        run: |
          cmake --version
          clang --version || true
          echo "LLVM_DIR=${LLVM_DIR:-unset}"

      # ---- stage 0: the C++ compiler ---------------------------------------
      - name: Configure and build stage 0
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMIKO_ENABLE_LLVM=ON \
            -DLLVM_DIR="$LLVM_DIR"
          cmake --build build --target miko

      # ---- stage 1: the self-hosted compiler -------------------------------
      # This is what ships. Building it here rather than trusting a committed binary
      # is the only way the release proves the compiler can compile itself here.
      - name: Build stage 1
        run: |
          set -euo pipefail
          stage0="$PWD/build/miko"
          # The compiler looks for miko.toolchain in the working directory first, so
          # writing it here decides how its output gets linked. The POSIX entry needs
          # the ./ prefix: system() resolves through the shell, which does not search
          # the current directory without it.
          chmod +x dist/miko-link.sh
          printf './dist/miko-link.sh\n' > miko.toolchain
          mkdir -p stage1
          "$stage0" compiler/main_ll.miko --compile --emit-ir -o stage1/miko.ll
          ./dist/miko-link.sh stage1/miko.ll stage1/miko
          ./stage1/miko --version

      # ---- prove the shipped compiler works --------------------------------
      # A release that cannot run its own test suite is not a release.
      - name: Run the differential suite against the shipped compiler
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/difftest.ps1 -RepoRoot . -CppCompiler build/miko -SelfCompiler stage1/miko
          if ($LASTEXITCODE -ne 0) { throw "difftest failed: $LASTEXITCODE case(s) disagreed" }

      # ---- assemble the package --------------------------------------------
      # The layout is flat on purpose. The compiler resolves two things by relative
      # path: runtime/miko_runtime.c for linking and stdlib/core/math.miko for
      # imports. Both have to sit beside the binary, so the archive root is the
      # directory the user works in.
      - name: Assemble the package
        run: |
          set -euo pipefail
          root="stage/miko"
          mkdir -p "$root/runtime" "$root/stdlib" "$root/compiler"
          cp stage1/miko "$root/miko"
          chmod +x "$root/miko"
          cp dist/miko-link.sh "$root/miko-link.sh"
          chmod +x "$root/miko-link.sh"
          printf './miko-link.sh\n' > "$root/miko.toolchain"
          cp runtime/miko_runtime.c "$root/runtime/"
          cp -r stdlib/core "$root/stdlib/"
          cp compiler/*.miko "$root/compiler/"
          cp README.md BUILD.md TUTORIAL.md BOOTSTRAP.md ROADMAP.md "$root/"
          cp -r tests "$root/"
          tar -czf "${{ matrix.archive }}" -C stage miko
          ls -l "${{ matrix.archive }}"

      # ---- prove the package is self-contained -----------------------------
      # Unpack it somewhere else and compile a program with nothing but what is
      # inside, from the package root. This is the check that would have caught
      # shipping a binary whose runtime/ was left behind.
      - name: Smoke test the package
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tar -xzf "${{ matrix.archive }}" -C "$work"
          cd "$work/miko"
          printf 'fn main() {\n    print("package ok");\n}\n' > smoke.miko
          ./miko smoke.miko smoke
          ./smoke

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Windows, built on Linux. No MSVC, no Windows runner, no Windows SDK.
  # ---------------------------------------------------------------------------
  cross-windows:
    name: windows, cross-compiled
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev clang-18 libclang-18-dev gcc \
            libtinfo-dev zlib1g-dev libzstd-dev
          echo "LLVM_DIR=$(llvm-config-18 --cmakedir)" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      # Only stage 0 needs LLVM, and it is built here for this runner. From stage 1
      # onwards everything is IR text, which is what makes the cross build possible.
      - name: Build stage 0 and stage 1
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMIKO_ENABLE_LLVM=ON -DLLVM_DIR="$LLVM_DIR"
          cmake --build build --target miko
          chmod +x dist/miko-link.sh
          printf './dist/miko-link.sh\n' > miko.toolchain
          mkdir -p stage1
          ./build/miko compiler/main_ll.miko --compile --emit-ir -o stage1/miko.ll
          ./dist/miko-link.sh stage1/miko.ll stage1/miko
          ./stage1/miko --version

      # The self-hosted compiler compiling itself is the IR that becomes every
      # Windows binary below. Emitting it with the self-hosted compiler rather than
      # with stage 0 is the point: stage 0 writes a target triple into the module,
      # this emits none, so the same text is valid for x64 and for arm64.
      - name: Emit the compiler's own IR
        run: |
          set -euo pipefail
          ./stage1/miko --self out/compiler
          ls -l out/compiler.ll
          if grep -qE '^target (triple|datalayout)' out/compiler.ll; then
            echo "the IR carries a target: the cross build is no longer portable" >&2
            exit 1
          fi
          echo "IR is target-neutral, $(wc -c < out/compiler.ll) bytes"

      - name: Install llvm-mingw
        run: |
          set -euo pipefail
          # A clang plus the MinGW-w64 C runtime and headers for both Windows
          # architectures, packaged for a Linux host. Nothing here needs Windows.
          base="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}"
          name="llvm-mingw-${LLVM_MINGW_TAG}-ucrt-ubuntu-22.04-x86_64"
          curl -fsSL "$base/$name.tar.xz" -o mingw.tar.xz
          mkdir -p /opt/llvm-mingw
          tar -xf mingw.tar.xz --strip-components=1 -C /opt/llvm-mingw
          rm -f mingw.tar.xz
          /opt/llvm-mingw/bin/clang --version
          /opt/llvm-mingw/bin/clang --target=x86_64-w64-mingw32 --print-target-triple
          /opt/llvm-mingw/bin/clang --target=aarch64-w64-mingw32 --print-target-triple
          echo "/opt/llvm-mingw/bin" >> "$GITHUB_PATH"

      # ---- the two packages -------------------------------------------------
      - name: Cross-link and package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          clang=/opt/llvm-mingw/bin/clang
          for pair in "x86_64-w64-mingw32 windows-x64" "aarch64-w64-mingw32 windows-arm64"; do
            set -- $pair
            triple="$1"; target="$2"
            echo "=== $target ($triple) ==="
            mkdir -p "stage-$target/miko/runtime" "stage-$target/miko/stdlib" "stage-$target/miko/compiler"
            root="stage-$target/miko"
            # -static so the archive does not need the MinGW runtime DLLs on the
            # user's machine. -Wno-override-module is a guard, not a workaround: the
            # IR has no triple, and if that ever changes this flag keeps the link
            # honest instead of silently compiling for the host.
            "$clang" --target="$triple" -O2 -Wno-override-module \
              out/compiler.ll runtime/miko_runtime.c \
              -o "$root/miko.exe" -static -fuse-ld=lld
            "$clang" --target="$triple" -print-file-name=libc++.a > /dev/null
            cp dist/miko-link.bat "$root/miko-link.bat"
            printf 'miko-link.bat\n' > "$root/miko.toolchain"
            cp runtime/miko_runtime.c "$root/runtime/"
            cp -r stdlib/core "$root/stdlib/"
            cp compiler/*.miko "$root/compiler/"
            cp README.md BUILD.md TUTORIAL.md BOOTSTRAP.md ROADMAP.md "$root/"
            cp -r tests "$root/"
            ( cd "stage-$target" && zip -qr "../miko-$VERSION-$target.zip" miko )
            ls -l "miko-$VERSION-$target.zip"
          done

      # ---- programs to run on Windows --------------------------------------
      # These are the differential suite, cross-linked. They cannot be run here, so
      # they travel with their expected output to a Windows runner: that is what
      # turns "the cross build compiled" into "the cross build runs".
      - name: Cross-link the differential suite
        run: |
          set -euo pipefail
          clang=/opt/llvm-mingw/bin/clang
          for pair in "x86_64-w64-mingw32 windows-x64" "aarch64-w64-mingw32 windows-arm64"; do
            set -- $pair
            triple="$1"; target="$2"
            mkdir -p "verify-$target"
            count=0
            for src in tests/diff/*.miko; do
              case "$src" in *_error.miko) continue ;; esac
              expected="${src%.miko}.expected"
              [ -f "$expected" ] || continue
              name="$(basename "${src%.miko}")"
              # IR from the Linux self-hosted compiler: no triple, so it is as valid
              # for this target as for the host it was produced on.
              ./stage1/miko --emit-ir "$src" "verify-$target/$name" > /dev/null 2>&1 || {
                echo "IR emission failed for $src" >&2; exit 1; }
              "$clang" --target="$triple" -O2 -Wno-override-module \
                "verify-$target/$name.ll" runtime/miko_runtime.c \
                -o "verify-$target/$name.exe" -static -fuse-ld=lld
              cp "$expected" "verify-$target/$name.expected"
              rm -f "verify-$target/$name.ll"
              count=$((count + 1))
            done
            echo "$target: $count cases cross-linked"
            [ "$count" -gt 0 ] || { echo "no cases were cross-linked" >&2; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: miko-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: miko-*-windows-arm64.zip
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: verify-windows-x64
          path: verify-windows-x64/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: verify-windows-arm64
          path: verify-windows-arm64/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Windows, verified on Windows. Runs the cross-built binaries on the architecture
  # they were built for; nothing is compiled here.
  # ---------------------------------------------------------------------------
  verify-windows:
    name: verify ${{ matrix.target }}
    needs: [version, cross-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: windows-11-arm
            target: windows-arm64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: pkg

      - uses: actions/download-artifact@v4
        with:
          name: verify-${{ matrix.target }}
          path: tests

      - name: Unpack and run the compiler
        shell: pwsh
        run: |
          $zip = Get-ChildItem pkg -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "no package artifact" }
          Expand-Archive -Path $zip.FullName -DestinationPath work
          Write-Host "processor: $env:PROCESSOR_ARCHITECTURE"
          $miko = "work\miko\miko.exe"
          if (-not (Test-Path $miko)) { throw "miko.exe missing from the package" }
          & $miko --version
          if ($LASTEXITCODE -ne 0) { throw "the cross-built compiler will not run here" }

      # --self writes IR and links nothing, so it exercises the compiler on sources
      # it has to read, parse, typecheck and lower - without needing a linker here.
      - name: Compile the compiler on Windows
        shell: pwsh
        run: |
          Push-Location work\miko
          try {
            New-Item -ItemType Directory -Force -Path out | Out-Null
            & .\miko.exe --self out\self
            if ($LASTEXITCODE -ne 0) { throw "--self failed on Windows" }
            $size = (Get-Item out\self.ll).Length
            Write-Host "self IR: $size bytes"
            if ($size -lt 1000000) { throw "the IR is too small to be the whole compiler" }
          } finally { Pop-Location }

      # The behavioural check: programs cross-linked from IR on Linux, executed here.
      - name: Run the cross-linked differential suite
        shell: pwsh
        run: |
          # Line endings are normalised before comparing. The .expected files are
          # stored with LF, while a Windows process writing through PowerShell gives
          # CRLF, so comparing raw strings reported sixteen correct programs as
          # failures on the first run of this job. Trailing blank lines are dropped
          # for the same reason: they are an artefact of capture, not of the program.
          function Normalize([string]$text) {
            if ($null -eq $text) { return "" }
            $t = $text -replace "`r`n", "`n"
            $t = $t -replace "`r", "`n"
            return $t.Trim()
          }
          $fail = 0
          $pass = 0
          foreach ($exe in (Get-ChildItem tests -Filter *.exe | Sort-Object Name)) {
            $expected = $exe.FullName -replace '\.exe$', '.expected'
            if (-not (Test-Path $expected)) { continue }
            $actual = Normalize (& $exe.FullName 2>&1 | Out-String)
            $want = Normalize (Get-Content $expected -Raw)
            if ($actual -eq $want) { $pass++ }
            else {
              $fail++
              Write-Host "FAIL $($exe.Name)"
              Write-Host "  want: $want"
              Write-Host "  got:  $actual"
            }
          }
          Write-Host "$pass passed, $fail failed"
          if ($fail -ne 0) { throw "$fail cross-linked case(s) disagreed" }
          if ($pass -eq 0) { throw "no cases ran" }

  # ---------------------------------------------------------------------------
  # Publish: the tag and the release, only after every platform above succeeded.
  # ---------------------------------------------------------------------------
  publish:
    name: tag and release
    needs: [version, build, cross-windows, verify-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Verification artifacts are inputs, not products: only archives are published.
      - name: Collect the archives
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          ls -l release
          count=$(find release -type f | wc -l)
          echo "publishing $count archives"
          [ "$count" -ge 6 ] || { echo "expected six archives, got $count" >&2; exit 1; }

      # The tag is created here rather than by a separate step so that a tag never
      # exists without a release behind it.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: miko ${{ needs.version.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          body: |
            miko ${{ needs.version.outputs.version }}, built from ${{ github.sha }}.

            Six archives: Linux x64 and arm64, macOS x64 and arm64, Windows x64 and
            arm64. Each contains the self-hosted compiler plus everything it needs at
            run time: the link script, `runtime/miko_runtime.c`, the standard library
            and the compiler's own sources, which `--self` reads.

            The Windows builds are cross-compiled with llvm-mingw on Linux and are
            statically linked, so they need no Visual Studio and no runtime DLLs. The
            macOS arm64 build carries its own C++ runtime for the same reason: it is
            linked against LLVM 22, and Apple's libc++ is not the same vintage.

            Unpack an archive and work from the directory it creates:

            ```
            tar -xzf miko-${{ needs.version.outputs.version }}-linux-x64.tar.gz
            cd miko
            ./miko --version
            ./miko program.miko program
            ./program
            ```

            The compiler emits LLVM IR and links it with `clang`, which must be on
            `PATH`. Set `CC` to use another C compiler.
